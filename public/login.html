<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - River Flood Early Warning System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .brand-icon {
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            margin: 0 auto 1rem auto;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .demo-credentials {
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .demo-credentials code {
            color: var(--accent-blue);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="glass-card">
            <div class="login-header">
                <div class="brand-icon"><i class="fas fa-user-shield"></i></div>
                <h1>Emergency System Login</h1>
                <p>Authorized Administrator Control Portal</p>
            </div>

            <div class="demo-credentials">
                <div><i class="fas fa-key" style="color: var(--accent-blue); margin-right: 6px;"></i> <strong>Default Credentials:</strong></div>
                <div style="margin-top: 0.4rem;">Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code></div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter admin username" required value="admin">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter admin password" required value="admin123">
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                    <i class="fas fa-sign-in-alt"></i> Authenticate &amp; Access Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                &copy; 2026 River Flood Early Warning System
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value.trim();

                    const btn = document.getElementById('login-btn');
                    btn.disabled = true;
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Authenticating...`;

                    try {
                        const res = await API.login(username, password);
                        if (!res.success) throw new Error(res.message);

                        Auth.login(res.user);
                        Toast.success('Authentication successful! Redirecting...');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 600);
                    } catch (err) {
                        Toast.error(err.message || 'Login failed');
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Authenticate & Access Dashboard`;
                    }
                });
            }
        });
    </script>
</body>
</html>
